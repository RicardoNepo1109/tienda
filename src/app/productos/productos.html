<section class="catalogo">
  <header class="catalogo-header">
    <h1>Catálogo de Productos</h1>
    <p>Explora los artículos disponibles en nuestra tienda.</p>
  </header>

  <div class="productos-grid">
    @for (producto of productos(); track producto.id) {
      <article class="producto-card">
        <div class="imagen-wrapper">
          <img
            [src]="producto.image || producto.imageUrl"
            [alt]="producto.title"
          >
        </div>

        <div class="producto-info">
          <span class="producto-categoria">{{ producto.category }}</span>
          <h2>{{ producto.title }}</h2>
          <p class="producto-descripcion">{{ producto.description }}</p>
        </div>

        <div class="producto-footer">
          <span class="producto-precio">${{ producto.price }}</span>

          <div class="producto-botones">
            <button
              type="button"
              class="btn btn-secundario"
              (click)="verDetalle(producto)"
            >
              Ver detalle
            </button>

            <button
              type="button"
              class="btn btn-primario"
              (click)="agregarAlCarrito(producto)"
            >
              Agregar
            </button>
          </div>
        </div>
      </article>
    }
  </div>
</section>
